<div
  class="flex flex-col h-screen bg-gray-900 text-white shadow-lg transition-all duration-300"
  [ngClass]="{ 'w-64': isExpanded, 'w-16': !isExpanded }"
>
  <!-- Expand/Collapse Button -->
  <div class="p-4 flex justify-center">
    <button
      (click)="toggleSidenav()"
      class="text-white focus:outline-none group"
    >
      <svg
        class="w-10 h-10 p-2 bg-sky-400 rounded-full transition-transform duration-300 group-hover:rotate-180"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          *ngIf="!isExpanded"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16m-7 6h7"
        ></path>
        <path
          *ngIf="isExpanded"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        ></path>
      </svg>
    </button>
  </div>

  <!-- Active Users List -->
  <div class="flex-1 overflow-y-auto px-2">
    <h2
      *ngIf="isExpanded"
      class="text-sm font-semibold ml-2 mb-3 text-gray-400 uppercase tracking-wide"
    >
      Active Users
    </h2>

    <div
      *ngFor="let user of onlineUsers"
      class="flex items-center mb-3 p-2 space-x-3 rounded-md transition-all duration-200 hover:bg-gray-800"
      [ngClass]="{ 'justify-center': !isExpanded, 'justify-start': isExpanded }"
    >
      <!-- User Avatar -->
      <div class="relative">
        <img
          [src]="user.profileImage"
          alt="User Image"
          class="w-10 h-10 rounded-full border-2 border-gray-700 object-cover"
          onerror="this.src='assets/default-avatar.png';"
        />
        <span
          class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-green-500 border-2 border-gray-900"
        ></span>
      </div>

      <!-- Username -->
      <span *ngIf="isExpanded" class="text-sm font-medium truncate">
        {{ user.username }}
      </span>
    </div>
  </div>

  <!-- Current User Profile -->
  <div
    class="relative p-4 border-t border-gray-700 flex items-center space-x-3 cursor-pointer hover:bg-gray-800 transition"
    (click)="toggleDropdown($event)"
    #dropdownTrigger
  >
    <!-- Profile Image -->
    <div class="relative w-10 h-10 shrink-0">
      <img
        [src]="currentUser?.profileImage"
        alt="Profile Image"
        class="w-full h-full rounded-full border-2 border-gray-700 object-cover"
      />
      <span
        class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-blue-500 border-2 border-gray-900"
      ></span>
    </div>

    <!-- Info -->
    <div
      class="transition-all duration-300"
      [ngClass]="{
        'opacity-100 w-40': isExpanded,
        'opacity-0 w-0': !isExpanded
      }"
    >
      <p class="text-sm font-semibold truncate" [title]="currentUser?.username">
        {{ currentUser?.username }}
      </p>
      <p class="text-xs text-gray-400 truncate" [title]="currentUser?.email">
        {{ currentUser?.email }}
      </p>
    </div>

    <!-- Dropdown -->
    <div
      *ngIf="showDropdown"
      class="absolute bottom-16 left-4 z-30 bg-white dark:bg-gray-700 divide-y divide-gray-100 dark:divide-gray-600 rounded-lg shadow-xl w-52 animate-fade-in-up"
      (click)="$event.stopPropagation()"
    >
      <div class="px-4 py-3 text-sm text-gray-900 dark:text-white">
        <div class="font-semibold">{{ currentUser?.username }}</div>
        <div class="truncate text-gray-500 dark:text-gray-300">
          {{ currentUser?.email }}
        </div>
      </div>
      <ul class="py-2 text-sm text-gray-700 dark:text-gray-200">
        <li>
          <a
            href="#"
            class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-600 dark:hover:text-white"
            >Settings</a
          >
        </li>
      </ul>
      <div class="py-2">
        <button
          (click)="logout()"
          class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-600 dark:hover:text-white"
        >
          Sign out
        </button>
      </div>
    </div>
  </div>
</div>
