<form (ngSubmit)="onSubmit()">
  <input
    type="text"
    [(ngModel)]="username"
    name="username"
    required
    placeholder="Username"
  />
  <input
    type="email"
    [(ngModel)]="email"
    name="email"
    required
    placeholder="Email"
  />
  <input
    type="password"
    [(ngModel)]="password"
    name="password"
    required
    placeholder="Password"
  />
  <button type="submit">Register</button>
</form>
