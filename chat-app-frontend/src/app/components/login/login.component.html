<p-toast />

<div
  class="flex items-center justify-center min-h-screen bg-gray-100 dark:bg-gray-900"
>
  <form
    (ngSubmit)="onSubmit()"
    class="max-w-sm w-full bg-white p-6 rounded-lg shadow-md dark:bg-gray-800"
  >
    <div class="mb-5">
      <label
        for="identifier"
        class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
      >
        Email or Username
      </label>
      <input
        type="text"
        id="identifier"
        [(ngModel)]="identifier"
        name="identifier"
        required
        placeholder="Enter your email or username"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
      />
    </div>

    <div class="mb-5 relative">
      <label
        for="password"
        class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
      >
        Password
      </label>
      <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
        [(ngModel)]="password"
        name="password"
        required
        placeholder="Enter your password"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 pr-10 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
      />
      <button
        type="button"
        (click)="togglePasswordVisibility()"
        class="absolute inset-y-0 mt-7 right-2 flex items-center px-2"
      >
        <mat-icon
          *ngIf="!showPassword"
          class="text-gray-500 text-sm"
          style="font-size: 18px"
        >
          visibility
        </mat-icon>
        <mat-icon
          *ngIf="showPassword"
          class="text-gray-500 text-sm"
          style="font-size: 18px"
        >
          visibility_off
        </mat-icon>
      </button>
    </div>

    <button
      type="submit"
      class="w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800"
    >
      Login
    </button>
  </form>
</div>
