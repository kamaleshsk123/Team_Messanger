<div
  class="flex items-center justify-between px-6 py-4 bg-white/5 dark:bg-black/10 backdrop-blur-xl border-b border-white/10 shadow-md rounded-t-xl transition-all duration-300"
>
  <!-- Left: Avatar + Info -->
  <div class="flex items-center space-x-4">
    <!-- Global Icon OR User Image -->
    <ng-container *ngIf="user?.username === 'Global'; else userAvatar">
      <div
        matTooltip="Global Chat"
        class="w-14 h-14 flex items-center justify-center rounded-full bg-gradient-to-br from-purple-600 via-blue-500 to-indigo-600 border-4 border-white/20 shadow-lg hover:shadow-2xl transition-transform duration-300 hover:scale-105 relative"
      >
        <mat-icon class="text-white text-3xl">language</mat-icon>
        <div
          class="absolute -bottom-1 -right-1 w-3 h-3 rounded-full bg-green-400 border-2 border-white animate-ping"
        ></div>
      </div>
    </ng-container>

    <ng-template #userAvatar>
      <div
        class="relative w-14 h-14 rounded-full border-4 border-blue-500/40 shadow-lg overflow-hidden hover:scale-105 transition-all duration-300"
      >
        <img
          [src]="user?.profileImage || 'assets/placeholder.png'"
          (error)="user.profileImage = 'assets/placeholder.png'"
          class="w-full h-full object-cover"
          alt="User Avatar"
        />
        <!-- Online Dot -->
        <span
          class="absolute -bottom-1 -right-1 w-3 h-3 rounded-full bg-green-400 border-2 border-white animate-pulse"
          *ngIf="user?.isOnline"
        ></span>
      </div>
    </ng-template>

    <!-- Username + Role Info -->
    <div class="flex flex-col">
      <div class="flex items-center space-x-2">
        <span
          class="text-lg font-semibold text-black dark:text-white truncate max-w-[180px]"
        >
          {{ user?.username }}
        </span>

        <!-- Role Badge -->
        <span
          *ngIf="user?.role"
          class="px-2 py-0.5 text-xs bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300 rounded-full"
        >
          {{ user.role }}
        </span>
      </div>
      <span class="text-sm text-gray-500 dark:text-gray-300 italic">
        {{ user?.username === "Global" ? "Broadcast Channel" : "Private Chat" }}
      </span>
    </div>
  </div>

  <!-- Right: Actions -->
  <div class="flex items-center gap-2">
    <button
      mat-icon-button
      matTooltip="Search"
      class="text-black dark:text-white hover:text-blue-400 dark:hover:text-blue-300 transition-transform duration-200 hover:scale-110"
    >
      <mat-icon>search</mat-icon>
    </button>
    <button
      mat-icon-button
      matTooltip="More"
      class="text-black dark:text-white hover:text-blue-400 dark:hover:text-blue-300 transition-transform duration-200 hover:rotate-90"
    >
      <mat-icon>more_vert</mat-icon>
    </button>
  </div>
</div>
